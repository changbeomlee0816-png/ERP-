name: Deploy to Cloudflare

# push 될 때마다 빌드 → Cloudflare Workers(funfun)에 배포합니다.
# 기본 base(/) 로 빌드하므로 자산 경로가 /assets/... 가 되어 워커 루트에 맞습니다.
on:
  push:
    branches:
      - claude/erp-system-data-enhancement-hh27b1
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드 (base = /)
        run: npm run build

      - name: Cloudflare Workers 에 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
