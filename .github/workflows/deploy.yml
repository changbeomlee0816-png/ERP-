name: Deploy to GitHub Pages

# 지정한 브랜치에 push 될 때마다 자동으로 빌드 → GitHub Pages 에 배포합니다.
# 배포 URL 은 항상 동일합니다: https://<계정>.github.io/ERP-/
on:
  push:
    branches:
      - claude/erp-system-data-enhancement-hh27b1
      - main
  workflow_dispatch: # 저장소 Actions 탭에서 수동 실행도 가능

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드 (base 경로 = 저장소 이름)
        run: npm run build -- --base=/ERP-/

      - name: 빌드 결과 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 에 배포
        id: deployment
        uses: actions/deploy-pages@v4
